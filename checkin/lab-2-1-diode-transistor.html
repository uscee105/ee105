<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  header { background: #990000; color: #fff; padding: 18px 20px; border-bottom: 4px solid #FFC72C; }

          border: 1.5px solid #ccc; border-radius: 8px; }
  button { font: inherit; font-weight: 600; width: 100%; margin-top: 12px; background: #990000;
           color: #fff; border: 0; border-radius: 8px; padding: 12px; cursor: pointer; }
  button:hover { background: #7a0000; }
  button:disabled { background: #bbb; cursor: wait; }
  label.rem { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 14px; color: #555; }
  #msg { margin-top: 14px; font-weight: 600; font-size: 15px; min-height: 1.4em; }
  #msg.bad { color: #b02a37; } #msg.info { color: #1e7e34; }

var GATE = {"always":true,"tz":"America/Los_Angeles","days":[2,4],"openMin":825,"closeMin":1110};

function b64d(s) { var bin = atob(s), a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

async function tryDecrypt(payload, pw) {
  try {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: b64d(payload.s), iterations: payload.n }, base, 256);
    var key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(payload.i) }, key, b64d(payload.c));
    return new TextDecoder().decode(pt);
  } catch (e) { return null; }
}

function labOpenAt(date) {
  if (GATE.always) return true;
  var parts = new Intl.DateTimeFormat("en-US", { timeZone: GATE.tz,
    weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(date);
  var get = function (t) { var p = parts.find(function (x) { return x.type === t; }); return p ? p.value : ""; };
  var day = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[get("weekday")];
  var mins = parseInt(get("hour"), 10) * 60 + parseInt(get("minute"), 10);
  return GATE.days.indexOf(day) !== -1 && mins >= GATE.openMin && mins < GATE.closeMin;
}
function labOpenNow() { return labOpenAt(new Date()); }

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
var REM_KEY = "ee105.checkin.unlock";

function show(cls, text) { var m = document.getElementById("msg"); m.className = cls; m.textContent = text; }

async function attempt(pw, silent) {
  var btn = document.getElementById("go");
  btn.disabled = true; show("info", "Checking…");
  var html = await tryDecrypt(STU_PAYLOAD, pw), kind = "student";
  if (html === null) { html = await tryDecrypt(TA_PAYLOAD, pw); kind = "staff"; }
  btn.disabled = false;
  if (html === null) {
    if (silent) { lsDel(REM_KEY); show("", ""); }
    else show("bad", "❌ Incorrect password.");
    return;
  }
  if (kind === "student" && !labOpenNow()) {
    show("bad", "⏳ That password works, but the lab task tracker only opens during lab sessions " +
      "(Tuesdays & Thursdays, 2:00–5:50 PM). See you in lab!");
    return;
  }
  if (document.getElementById("rem").checked || silent) {
    lsSet(REM_KEY, { p: pw, exp: Date.now() + 7 * 864e5 });
  }
  document.open(); document.write(html); document.close();
}

function init() {
  document.getElementById("go").addEventListener("click", function () {
    attempt(document.getElementById("pw").value, false);
  });
  document.getElementById("pw").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") attempt(document.getElementById("pw").value, false);
  });
  var saved = lsGet(REM_KEY);
  if (saved && saved.p && saved.exp > Date.now()) attempt(saved.p, true);
  else if (saved) lsDel(REM_KEY);
}
if (typeof window !== "undefined" && typeof document !== "undefined") init();
